default:
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"


stages: [test, build, integration, push]

r-tests:
  stage: test
  image: registry.gitlab.com/alserglab/pr/phantasus/phantasus-preimage:latest
  services: []        # no DinD needed here
  script:
    # (optional) install rcmdcheck/devtools if they’re not already in the image
    - R -q -e 'if (!requireNamespace("rcmdcheck", quietly=TRUE)) install.packages("rcmdcheck", repos="https://cloud.r-project.org")'

    - R -q -e 'devtools::install_dev_deps()'

    # Build + check the package from the repo GitLab just checked out
    - R -q -e 'rcmdcheck::rcmdcheck(path = ".", args = c("--no-manual"), error_on = "warning")'
  rules:
    - if: '$CI_COMMIT_BRANCH'   # run on all branches
  interruptible: true

js-tests:
  stage: test
  image: registry.gitlab.com/alserglab/pr/phantasus/phantasus-preimage:latest
  services: []        # no DinD needed here
  script:
    - R -q -e 'devtools::install_dev_deps()'

    # Install real Firefox from Mozilla's official apt repo (the Ubuntu
    # noble package is a snap stub and cannot run headless in containers)
    - |
      apt-get update -qq && apt-get install -y --no-install-recommends wget gpg
      wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- \
          | gpg --dearmor > /etc/apt/trusted.gpg.d/packages.mozilla.org.gpg
      echo "deb [signed-by=/etc/apt/trusted.gpg.d/packages.mozilla.org.gpg] https://packages.mozilla.org/apt mozilla main" \
          > /etc/apt/sources.list.d/mozilla.list
      printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n\n' \
          > /etc/apt/preferences.d/mozilla
      apt-get update -qq && apt-get install -y --no-install-recommends nodejs npm firefox
    - ./inst/test_js.sh
  rules:
    - if: '$CI_COMMIT_BRANCH'   # run on all branches
  interruptible: true

# Build every commit. Tag with short SHA.
docker-build:
  stage: build
  script:
    - echo "Logging in to registry"
    - echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u gitlab-ci-token --password-stdin
    - IMAGE_TAG="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    - FULL_IMAGE_TAG="$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - echo "Building $IMAGE_TAG"
    - |
      docker build --pull \
          --build-arg PREIMAGE_NAME="registry.gitlab.com/alserglab/pr/phantasus/phantasus-preimage" \
          --build-arg TARGET_BRANCH="${CI_COMMIT_BRANCH}" \
          --build-arg PHANTASUS_BUILD="${IMAGE_TAG}" \
          -t "$FULL_IMAGE_TAG" .
    - docker push "$FULL_IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH'  # all branches
  interruptible: true

integration-test:
  stage: integration
  needs: ["docker-build"]
  script:
    - IMAGE_TAG="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE:${IMAGE_TAG}"
    - docker run -d --name phantasus-ci "$CI_REGISTRY_IMAGE:${IMAGE_TAG}"
    - |
      docker exec phantasus-ci Rscript --vanilla -e '
        deadline <- Sys.time() + 240
        url <- "http://localhost:8000/phantasus/ocpu/library/phantasus/R/"
        repeat {
          code <- tryCatch(
            httr::status_code(httr::GET(url, httr::timeout(5))),
            error = function(e) 0L
          )
          if (code == 200L) { message("Ready"); break }
          if (Sys.time() > deadline) stop("Not ready after 120s")
          Sys.sleep(5)
        }'
  after_script:
    - docker stop phantasus-ci || true
    - docker rm   phantasus-ci || true
  rules:
    - if: '$CI_COMMIT_BRANCH'
  interruptible: true

# Push stable tags for releases & the default branch
docker-push-tags:
  stage: push
  needs: ["docker-build", "r-tests", "js-tests", "integration-test"]
  script:
    - docker login -u gitlab-ci-token -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - IMAGE_TAG="$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    # latest for default branch
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker pull "$CI_REGISTRY_IMAGE:${IMAGE_TAG}"
        docker tag  "$CI_REGISTRY_IMAGE:${IMAGE_TAG}" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
        DATE_TAG="$CI_COMMIT_BRANCH-$(date +%Y%m%d)"
        docker tag  "$CI_REGISTRY_IMAGE:${IMAGE_TAG}" "$CI_REGISTRY_IMAGE:$DATE_TAG"
        docker push "$CI_REGISTRY_IMAGE:$DATE_TAG"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  interruptible: true
